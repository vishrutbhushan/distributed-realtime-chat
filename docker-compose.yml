# Distributed Real-time Chat and Collaboration Tool
# Nginx Load Balancer + Docker DNS Service Discovery (6 Replicas)
#   Web UI: http://localhost:8000
#   Scale : docker compose up -d --scale app-node=N

services:

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8088}:8080"
    environment:
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - app-node
    networks:
      - chat-net

  # Nginx load balancer with session affinity
  nginx-lb:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "8000:8000"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx-replicas.sh:/etc/nginx/raft-start.sh:ro
    environment:
      CLUSTER_NODE_PREFIX: "${COMPOSE_PROJECT_NAME}-app-node-"
      APP_REPLICA_SLOTS: "${APP_REPLICA_SLOTS:-16}"
    command: ["/bin/sh", "/etc/nginx/raft-start.sh"]
    depends_on:
      - app-node
    networks:
      - chat-net
    restart: unless-stopped

  # Dedicated local LLM server
  llm-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.llm
    container_name: llm-server
    ports:
      - "50060:50060"
    environment:
      LLM_PORT: "50060"
      MODEL_PATH: "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
      MODEL_N_CTX: "4096"
      MODEL_THREADS: "4"
      MODEL_TIMEOUT_SECONDS: "60"
      MODEL_N_GPU_LAYERS: "-1"
      LOG_FILE: "/logs/app.log"
    volumes:
      - ./logs:/logs
      - ./llm:/app/llm:ro
    networks:
      - chat-net
    restart: unless-stopped
    stop_grace_period: 3s

  # Raft application node service
  app-node:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    image: distributed-realtime-chat-app-node:latest
    deploy:
      replicas: 6
    environment:
      CLUSTER_DNS: "app-node"
      CLUSTER_NODE_PREFIX: "${COMPOSE_PROJECT_NAME}-app-node-"
      RAFT_VOTER_COUNT: "${RAFT_VOTER_COUNT:-6}"
      PORT:        "50051"
      WEB_PORT:    "8000"
      RAFT_PORT:   "50071"
      LLM_SERVER:  "llm-server:50060"
      LOG_FILE:    "/logs/app.log"
    volumes:
      - cluster-data:/data
      - ./logs:/logs
    networks:
      - chat-net
    restart: unless-stopped
    stop_grace_period: 2s

volumes:
  cluster-data:

networks:
  chat-net:
    driver: bridge
