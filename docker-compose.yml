# ─────────────────────────────────────────────────────────────────────────────
# Distributed Real-time Chat and Collaboration Tool — Docker Compose
# Milestone 2: Nginx Load Balancer + Docker DNS Service Discovery (5 Replicas)
#   Web UI (Load Balanced): http://localhost:8000
#   Scale dynamically     : docker compose up -d --scale app-node=N
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Nginx Least-Connections Load Balancer (Docker DNS Service Discovery) ───
  nginx-lb:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "8000:8000"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    command: >
      /bin/sh -c "
      (while true; do
        NEW=$$(getent ahostsv4 app-node | awk '{print $$1}' | sort -u | tr '\n' ' ');
        if [ \"$$NEW\" != \"$$OLD\" ] && [ -n \"$$OLD\" ]; then
          nginx -s reload 2>/dev/null || true;
        fi;
        OLD=\"$$NEW\";
        sleep 2;
      done) &
      exec nginx -g 'daemon off;'"
    depends_on:
      - app-node
    networks:
      - chat-net
    restart: unless-stopped

  # ── Dedicated Local LLM Server ─────────────────────────────────────────────
  llm-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.llm
    container_name: llm-server
    ports:
      - "50060:50060"
    environment:
      LLM_PORT: "50060"
      MODEL_PATH: "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
      MODEL_N_CTX: "4096"
      MODEL_THREADS: "4"
      MODEL_TIMEOUT_SECONDS: "60"
      MODEL_N_GPU_LAYERS: "-1"
      LOG_FILE: "/logs/app.log"
    volumes:
      - ./logs:/logs
    networks:
      - chat-net
    restart: unless-stopped
    stop_grace_period: 3s

  # ── Scaled Raft Application Node Service (Discovered via Docker DNS) ───────
  app-node:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    image: distributed-realtime-chat-app-node:latest
    deploy:
      replicas: 5
    environment:
      CLUSTER_DNS: "app-node"
      PORT:        "50051"
      WEB_PORT:    "8000"
      RAFT_PORT:   "50071"
      LLM_SERVER:  "llm-server:50060"
      LOG_FILE:    "/logs/app.log"
    volumes:
      - cluster-data:/data
      - ./logs:/logs
    networks:
      - chat-net
    restart: unless-stopped
    stop_grace_period: 2s

volumes:
  cluster-data:

networks:
  chat-net:
    driver: bridge
