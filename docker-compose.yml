# ─────────────────────────────────────────────────────────────────────────────
# Distributed Real-time Chat and Collaboration Tool — Docker Compose
# Milestone 1: App Node + CPU-optimized LLM Server + Automated Client Runner
# Web UI Gateway available at http://localhost:8000
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── LLM Server (Standalone Instance, port 50060) ───────────────────────────
  llm-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.llm
    container_name: llm-server
    ports:
      - "50060:50060"
    environment:
      LLM_PORT: "50060"
    networks:
      - chat-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import grpc; import sys; sys.path.insert(0,'generated');\
              import llm_pb2_grpc, llm_pb2;\
              ch=grpc.insecure_channel('localhost:50060');\
              stub=llm_pb2_grpc.LLMServiceStub(ch);\
              stub.GetLLMAnswer(llm_pb2.LLMRequest(request_id='hc',query='ping',feature='SMART_REPLY'))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── App Node 1 (Monolith: gRPC :50051 + Web Gateway :8000) ─────────────────
  app-node-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: app-node-1
    ports:
      - "50051:50051"
      - "8000:8000"
    environment:
      NODE_ID:           "node-1"
      PORT:              "50051"
      WEB_PORT:          "8000"
      DB_PATH:           "/data/chat.db"
      FILE_STORAGE_PATH: "/data/files/"
      LLM_SERVER:        "llm-server:50060"
      # PEERS: ""   # comma-separated peer addresses for Milestone 2
    volumes:
      - node1-data:/data
    depends_on:
      llm-server:
        condition: service_healthy
    networks:
      - chat-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import grpc; import sys; sys.path.insert(0,'generated');\
              import chat_pb2_grpc, chat_pb2;\
              ch=grpc.insecure_channel('localhost:50051');\
              stub=chat_pb2_grpc.ChatServiceStub(ch);\
              stub.GetNodeStatus(chat_pb2.GetNodeStatusRequest())"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Client Runner (Automated Milestone 1 Verification Suite) ───────────────
  client-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: client-runner
    environment:
      APP_SERVER: "app-node-1:50051"
    command: ["python", "client/client.py", "--server", "app-node-1:50051", "--demo"]
    depends_on:
      app-node-1:
        condition: service_healthy
    networks:
      - chat-net
    restart: "no"   # run once then exit

