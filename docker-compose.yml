# ─────────────────────────────────────────────────────────────────────────────

# Milestone 1: single app node + LLM server + client runner
#
# For Milestone 2 (Raft), duplicate app-node-1 into app-node-2..5 and set
# PEERS appropriately.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── LLM server ─────────────────────────────────────────────────────────────
  llm-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.llm
    ports:
      - "50060:50060"
    environment:
      LLM_PORT: "50060"
      MODEL_PATH: "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
      MODEL_N_CTX: "4096"
      MODEL_THREADS: "4"
      MODEL_TIMEOUT_SECONDS: "60"
    networks:
      - chat-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import grpc; ch=grpc.insecure_channel('localhost:50060');\
              grpc.channel_ready_future(ch).result(timeout=2); ch.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  # ── App node 1 (Milestone 1: STANDALONE) ───────────────────────────────────
  app-node-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    ports:
      - "50051:50051"
    environment:
      NODE_ID:           "node-1"
      PORT:              "50051"
      DB_PATH:           "/data/chat.db"
      FILE_STORAGE_PATH: "/data/files/"
      LLM_SERVER:        "llm-server:50060"
      # PEERS: ""   # comma-separated peer addresses for Milestone 2
    volumes:
      - node1-data:/data
    networks:
      - chat-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import grpc; ch=grpc.insecure_channel('localhost:50051');\
              grpc.channel_ready_future(ch).result(timeout=2); ch.close()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Client runner (automated demo) ─────────────────────────────────────────
  client-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    environment:
      APP_SERVER: "app-node-1:50051"
    command: ["python", "client/client.py", "--server", "app-node-1:50051", "--demo"]
    depends_on:
      app-node-1:
        condition: service_healthy
    networks:
      - chat-net
    restart: "no"   # run once then exit

