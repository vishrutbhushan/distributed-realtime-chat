# ─────────────────────────────────────────────────────────────────────────────
# Distributed Real-time Chat and Collaboration Tool — Docker Compose
# Milestone 1: App Node (gRPC + Web UI) + Dedicated Local LLM Server + Demo Runner
# Web UI Gateway available at: http://localhost:8000
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── LLM Server (Dedicated Instance, port 50060) ────────────────────────────
  llm-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.llm
    container_name: llm-server
    ports:
      - "50060:50060"
    environment:
      LLM_PORT: "50060"
      MODEL_PATH: "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
      MODEL_N_CTX: "4096"
      MODEL_THREADS: "4"
      MODEL_TIMEOUT_SECONDS: "60"
    networks:
      - chat-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import grpc; ch=grpc.insecure_channel('localhost:50060');\
              grpc.channel_ready_future(ch).result(timeout=2); ch.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  # ── App Node 1 (Monolith: gRPC :50051 + Web Gateway :8000) ─────────────────
  app-node-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: app-node-1
    ports:
      - "50051:50051"
      - "8000:8000"
    environment:
      NODE_ID:           "node-1"
      PORT:              "50051"
      WEB_PORT:          "8000"
      DB_PATH:           "/data/chat.db"
      FILE_STORAGE_PATH: "/data/files/"
      LLM_SERVER:        "llm-server:50060"
      # PEERS: ""   # Comma-separated peer addresses for Milestone 2
    volumes:
      - node1-data:/data
    networks:
      - chat-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import grpc; ch=grpc.insecure_channel('localhost:50051');\
              grpc.channel_ready_future(ch).result(timeout=2); ch.close()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Client Runner (Automated Milestone 1 Verification Suite) ───────────────
  client-runner:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: client-runner
    environment:
      APP_SERVER: "app-node-1:50051"
    command: ["python", "client/client.py", "--server", "app-node-1:50051", "--demo"]
    depends_on:
      app-node-1:
        condition: service_healthy
    networks:
      - chat-net
    restart: "no"   # run once then exit

