events {
    worker_connections 1024;
}

http {
    # Docker Embedded DNS server for dynamic service discovery
    resolver 127.0.0.11 valid=1s ipv6=off;

    # Least-connections pool for initial assignment & failover backup
    upstream chat_cluster {
        zone chat_cluster 64k;
        least_conn;
        server app-node:8000 max_conns=3 max_fails=1 fail_timeout=2s;
    }

    # Sticky per-node pools: stay on pinned node unless overloaded (max_conns=3) or unreachable
    upstream sticky_node_1 {
        least_conn;
        server distributed-realtime-chat-app-node-1:8000 max_conns=3 max_fails=1 fail_timeout=2s;
        server app-node:8000 backup;
    }
    upstream sticky_node_2 {
        least_conn;
        server distributed-realtime-chat-app-node-2:8000 max_conns=3 max_fails=1 fail_timeout=2s;
        server app-node:8000 backup;
    }
    upstream sticky_node_3 {
        least_conn;
        server distributed-realtime-chat-app-node-3:8000 max_conns=3 max_fails=1 fail_timeout=2s;
        server app-node:8000 backup;
    }
    upstream sticky_node_4 {
        least_conn;
        server distributed-realtime-chat-app-node-4:8000 max_conns=3 max_fails=1 fail_timeout=2s;
        server app-node:8000 backup;
    }
    upstream sticky_node_5 {
        least_conn;
        server distributed-realtime-chat-app-node-5:8000 max_conns=3 max_fails=1 fail_timeout=2s;
        server app-node:8000 backup;
    }

    map $arg_node $sticky_pool {
        default   chat_cluster;
        "node-1"  sticky_node_1;
        "node-2"  sticky_node_2;
        "node-3"  sticky_node_3;
        "node-4"  sticky_node_4;
        "node-5"  sticky_node_5;
    }

    server {
        listen 8000;
        client_max_body_size 60M;

        # Persistent SSE stream — sticky to assigned node unless overloaded or unreachable
        location /api/events {
            proxy_pass http://$sticky_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }

        location / {
            proxy_pass http://$sticky_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }
    }
}
