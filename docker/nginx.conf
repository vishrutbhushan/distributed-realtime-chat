events {
    worker_connections 1024;
}

http {
    # Docker Embedded DNS server for dynamic service discovery
    resolver 127.0.0.11 valid=2s ipv6=off;

    # Session affinity key priority:
    # 1. Custom HTTP header X-Chat-Session (isolated per browser tab in sessionStorage)
    # 2. Query param session_id (e.g. /api/events?session_id=... for SSE)
    # 3. Cookie chat_session (fallback for browser and python clients)
    # 4. Generated $request_id (fallback for fresh requests)
    map $http_x_chat_session $session_key {
        ""      $session_key_from_arg;
        default $http_x_chat_session;
    }

    map $arg_session_id $session_key_from_arg {
        ""      $session_key_from_cookie;
        default $arg_session_id;
    }

    map $cookie_chat_session $session_key_from_cookie {
        ""      $request_id;
        default $cookie_chat_session;
    }

    map $cookie_chat_session $affinity_cookie {
        ""      "chat_session=$session_key; Path=/; HttpOnly; SameSite=Lax";
        default "";
    }

    upstream chat_cluster {
        zone chat_cluster 64k;
        hash $session_key consistent;
        include /etc/nginx/raft-replicas.conf;
    }

    server {
        listen 8000;
        client_max_body_size 60M;
        add_header Set-Cookie $affinity_cookie always;
        proxy_http_version 1.1;
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_timeout 5s;
        proxy_next_upstream_tries 3;

        location = /internal/raft-monitor {
            return 404;
        }

        # Flush SSE frames as soon as the app sends them.
        location /api/events {
            proxy_pass http://chat_cluster;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        location / {
            proxy_pass http://chat_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
