syntax = "proto3";

package raft;

message LogEntry {
  int64  index        = 1;
  int64  term         = 2;
  string command_type = 3;
  string payload      = 4;
  string request_id   = 5;
}

// Assignment Required Signatures (Page 7)
message RequestVoteArgs {
  string from           = 1;
  string to             = 2;
  int64  term           = 3;
  int64  last_log_index = 4;
  int64  last_log_term  = 5;
}

message RequestVoteReply {
  string from         = 1;
  string to           = 2;
  int64  term         = 3;
  bool   vote_granted = 4;
}

message AppendEntriesArgs {
  string            from         = 1;
  string            to           = 2;
  int64             term         = 3;
  int64             prev_index   = 4;
  int64             prev_term    = 5;
  int64             commit_index = 6;
  repeated LogEntry entries      = 7;
}

message AppendEntriesReply {
  string from           = 1;
  string to             = 2;
  int64  term           = 3;
  bool   entry_appended = 4;
  int64  match_index    = 5;
}

// Dynamic Cluster Membership Discovery
message PeerInfo {
  string node_id   = 1;
  string raft_addr = 2;
  string app_addr  = 3;
}

message PeerReply {
  bool              success   = 1;
  string            leader_id = 2;
  int64             term      = 3;
  repeated PeerInfo peers     = 4;
}

service RaftService {
  rpc RequestVote(RequestVoteArgs)     returns (RequestVoteReply);
  rpc AppendEntries(AppendEntriesArgs) returns (AppendEntriesReply);
  rpc AddPeer(PeerInfo)                returns (PeerReply);
}
