syntax = "proto3";

package raft;



// ─────────────────────────────────────────────────────────────
// Log entries
// ─────────────────────────────────────────────────────────────

message LogEntry {
  int64  index        = 1;
  int64  term         = 2;
  string command_type = 3;   // SEND_MESSAGE, CREATE_CHANNEL, JOIN_CHANNEL, etc.
  bytes  payload      = 4;   // JSON-serialised command args
  string request_id   = 5;
}

// ─────────────────────────────────────────────────────────────
// Leader Election
// ─────────────────────────────────────────────────────────────

message RequestVoteRequest {
  int64  term           = 1;
  string candidate_id   = 2;
  int64  last_log_index = 3;
  int64  last_log_term  = 4;
}

message RequestVoteResponse {
  int64 term         = 1;
  bool  vote_granted = 2;
}

// ─────────────────────────────────────────────────────────────
// Log Replication / Heartbeat
// ─────────────────────────────────────────────────────────────

message AppendEntriesRequest {
  int64           term           = 1;
  string          leader_id      = 2;
  int64           prev_log_index = 3;
  int64           prev_log_term  = 4;
  repeated LogEntry entries      = 5;
  int64           leader_commit  = 6;
}

message AppendEntriesResponse {
  int64 term        = 1;
  bool  success     = 2;
  int64 match_index = 3;   // highest index follower has
  int64 hint_index  = 4;   // optimistic conflict back-step hint
}

// ─────────────────────────────────────────────────────────────
// Service
// ─────────────────────────────────────────────────────────────

service RaftService {
  rpc RequestVote(RequestVoteRequest)     returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}
