syntax = "proto3";

package llm;

// ─────────────────────────────────────────────────────────────
// Generic LLM call
// ─────────────────────────────────────────────────────────────

message LLMRequest {
  string request_id = 1;
  string query      = 2;
  string context    = 3;
  string feature    = 4; // SMART_REPLY | SUMMARIZE | SUGGEST
}

message LLMResponse {
  string request_id = 1;
  string result     = 2;
  bool   success    = 3;
  string error      = 4;
}

// ─────────────────────────────────────────────────────────────
// Feature 1: Smart Replies (over full chat history)
// ─────────────────────────────────────────────────────────────

message SmartReplyRequest {
  string          request_id      = 1;
  repeated string chat_history    = 2; // entire conversation history as "username: message"
  string          current_message = 3;
  string          context_title   = 4;
}

message SmartReplyResponse {
  string          request_id  = 1;
  repeated string suggestions = 2; // 3 concise suggestions
  bool            success     = 3;
  string          error       = 4;
}

// ─────────────────────────────────────────────────────────────
// Feature 2: Conversation Summarization (over full chat history)
// ─────────────────────────────────────────────────────────────

message SummarizeRequest {
  string          request_id   = 1;
  repeated string chat_history = 2; // entire conversation history as "username: message"
  string          context_title= 3;
}

message SummarizeResponse {
  string request_id = 1;
  string summary    = 2;
  bool   success    = 3;
  string error      = 4;
}

// ─────────────────────────────────────────────────────────────
// Feature 3: Context Suggestion
// ─────────────────────────────────────────────────────────────

message ContextSuggestionRequest {
  string          request_id   = 1;
  repeated string chat_history = 2;
  string          context_title= 3;
  string          current_user = 4;
}

message ContextSuggestionResponse {
  string request_id = 1;
  string suggestion = 2;
  bool   success    = 3;
  string error      = 4;
}

// ─────────────────────────────────────────────────────────────
// Service Definition
// ─────────────────────────────────────────────────────────────

service LLMService {
  rpc GetLLMAnswer(LLMRequest)                       returns (LLMResponse);
  rpc GetSmartReplies(SmartReplyRequest)             returns (SmartReplyResponse);
  rpc SummarizeConversation(SummarizeRequest)        returns (SummarizeResponse);
  rpc GetContextSuggestion(ContextSuggestionRequest) returns (ContextSuggestionResponse);
}
