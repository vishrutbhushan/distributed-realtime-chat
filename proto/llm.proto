syntax = "proto3";

package llm;



// ─────────────────────────────────────────────────────────────
// Generic LLM call
// ─────────────────────────────────────────────────────────────

message LLMRequest {
  string request_id = 1;
  string query      = 2;
  string context    = 3;
  string feature    = 4;   // SMART_REPLY | SUMMARIZE | SUGGEST
}

message LLMResponse {
  string request_id = 1;
  string result     = 2;
  bool   success    = 3;
  string error      = 4;
}

// ─────────────────────────────────────────────────────────────
// Feature 1: Smart Replies
// ─────────────────────────────────────────────────────────────

message SmartReplyRequest {
  string          request_id       = 1;
  repeated string recent_messages  = 2;   // last N messages as "user: text"
  string          current_message  = 3;   // the message to reply to
  string          channel_name     = 4;
}

message SmartReplyResponse {
  string          request_id   = 1;
  repeated string suggestions  = 2;
  bool            success      = 3;
  string          error        = 4;
}

// ─────────────────────────────────────────────────────────────
// Feature 2: Conversation Summarization
// ─────────────────────────────────────────────────────────────

message SummarizeRequest {
  string          request_id   = 1;
  repeated string messages     = 2;   // "user: text" lines
  string          channel_name = 3;
}

message SummarizeResponse {
  string request_id = 1;
  string summary    = 2;
  bool   success    = 3;
  string error      = 4;
}

// ─────────────────────────────────────────────────────────────
// Feature 3: Context-Aware Suggestions
// ─────────────────────────────────────────────────────────────

message ContextSuggestionRequest {
  string          request_id      = 1;
  repeated string recent_messages = 2;
  string          channel_name    = 3;
  string          current_user    = 4;
}

message ContextSuggestionResponse {
  string request_id = 1;
  string suggestion = 2;
  bool   success    = 3;
  string error      = 4;
}

// ─────────────────────────────────────────────────────────────
// Service
// ─────────────────────────────────────────────────────────────

service LLMService {
  rpc GetLLMAnswer(LLMRequest)                         returns (LLMResponse);
  rpc GetSmartReplies(SmartReplyRequest)               returns (SmartReplyResponse);
  rpc SummarizeConversation(SummarizeRequest)          returns (SummarizeResponse);
  rpc GetContextSuggestion(ContextSuggestionRequest)   returns (ContextSuggestionResponse);
}
