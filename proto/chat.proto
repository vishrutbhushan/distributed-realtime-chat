syntax = "proto3";

package chat;

// ─────────────────────────────────────────────────────────────
// Auth RPCs & Messages
// ─────────────────────────────────────────────────────────────

message SignupRequest {
  string username = 1;
  string password = 2;
}

message SignupResponse {
  bool   success  = 1;
  string token    = 2;
  string user_id  = 3;
  string username = 4;
  string message  = 5;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  bool   success  = 1;
  string token    = 2;
  string user_id  = 3;
  string username = 4;
  string message  = 5;
}

message LogoutRequest {
  string token = 1;
}

message LogoutResponse {
  bool   success = 1;
  string message = 2;
}

// ─────────────────────────────────────────────────────────────
// Directory & Presence
// ─────────────────────────────────────────────────────────────

message UserItem {
  string user_id           = 1;
  string username          = 2;
  string status            = 3; // "active" | "inactive"
  int64  last_seen         = 4;
  int64  last_message_time = 5;
  int32  unread_count      = 6;
  string last_message      = 7;
}

message ListUsersRequest {
  string token = 1;
}

message ListUsersResponse {
  repeated UserItem users = 1;
}

message GetUserRequest {
  string token   = 1;
  string user_id = 2;
}

message GetUserResponse {
  bool     success = 1;
  UserItem user    = 2;
  string   error   = 3;
}

message UpdatePresenceRequest {
  string token  = 1;
  string status = 2; // "active" | "inactive"
}

message UpdatePresenceResponse {
  bool success = 1;
}

// ─────────────────────────────────────────────────────────────
// Message Data Structures
// ─────────────────────────────────────────────────────────────

message Message {
  string message_id        = 1;
  string chat_type         = 2; // "DM" | "GROUP"
  string sender_id         = 3;
  string sender_username   = 4;
  string recipient_id      = 5; // user_id for DM
  string group_id          = 6; // group_id for GROUP
  string content           = 7;
  int64  timestamp         = 8; // ms epoch
  string client_request_id = 9;
  int64  raft_log_index    = 10;
  string file_id           = 11;
  string filename          = 12;
  string file_type         = 13; // "image" | "pdf" | "other"
  int64  file_size         = 14;
}

message SendMessageResponse {
  bool    success = 1;
  Message message = 2;
  string  error   = 3;
}

message GetMessagesResponse {
  repeated Message messages = 1;
}

// ─────────────────────────────────────────────────────────────
// Direct Messaging (1-to-1)
// ─────────────────────────────────────────────────────────────

message SendDirectMessageRequest {
  string token             = 1;
  string recipient_user_id = 2;
  string content           = 3;
  string client_request_id = 4;
  string file_id           = 5;
}

message GetDirectMessagesRequest {
  string token            = 1;
  string other_user_id    = 2;
  int32  limit            = 3;
  int64  before_timestamp = 4;
}

// ─────────────────────────────────────────────────────────────
// Group Chat & Management
// ─────────────────────────────────────────────────────────────

message Group {
  string group_id          = 1;
  string name              = 2;
  string created_by        = 3;
  string created_by_name   = 4;
  int64  created_at        = 5;
  int32  member_count      = 6;
  string user_role         = 7; // "ADMIN" | "MEMBER"
  int64  last_message_time = 8;
  int32  unread_count      = 9;
  string last_message      = 10;
}

message GroupMember {
  string user_id   = 1;
  string username  = 2;
  string role      = 3; // "ADMIN" | "MEMBER"
  string status    = 4; // "active" | "inactive"
  int64  joined_at = 5;
}

message CreateGroupRequest {
  string          token                   = 1;
  string          name                    = 2;
  repeated string initial_member_user_ids = 3;
}

message CreateGroupResponse {
  bool   success = 1;
  Group  group   = 2;
  string message = 3;
}

message UpdateGroupRequest {
  string token          = 1;
  string group_id       = 2;
  string action         = 3; // "RENAME" | "ADD_MEMBER" | "REMOVE_MEMBER" | "MAKE_ADMIN"
  string target_user_id = 4; // for ADD_MEMBER, REMOVE_MEMBER, MAKE_ADMIN
  string new_name       = 5; // for RENAME
}

message UpdateGroupResponse {
  bool   success = 1;
  Group  group   = 2;
  string message = 3;
}

message ListGroupsRequest {
  string token = 1;
}

message ListGroupsResponse {
  repeated Group groups = 1;
}

message GetGroupMembersRequest {
  string token    = 1;
  string group_id = 2;
}

message GetGroupMembersResponse {
  repeated GroupMember members = 1;
}

message SendGroupMessageRequest {
  string token             = 1;
  string group_id          = 2;
  string content           = 3;
  string client_request_id = 4;
  string file_id           = 5;
}

message GetGroupMessagesRequest {
  string token            = 1;
  string group_id         = 2;
  int32  limit            = 3;
  int64  before_timestamp = 4;
}

// ─────────────────────────────────────────────────────────────
// Real-time Streaming
// ─────────────────────────────────────────────────────────────

message StreamMessagesRequest {
  string token = 1;
}

message MessageEvent {
  string  event_type = 1; // "NEW_MESSAGE"
  Message message    = 2;
}

// ─────────────────────────────────────────────────────────────
// File Sharing (PDFs & Images)
// ─────────────────────────────────────────────────────────────

message FileMetadata {
  string file_id      = 1;
  string filename     = 2;
  string file_type    = 3; // "image" | "pdf" | "other"
  string content_type = 4;
  int64  size_bytes   = 5;
  string owner_id     = 6;
  string chat_type    = 7; // "DM" | "GROUP"
  string target_id    = 8; // user_id or group_id
  int64  uploaded_at  = 9;
}

message UploadFileRequest {
  string token        = 1;
  string chat_type    = 2; // "DM" | "GROUP"
  string target_id    = 3; // recipient user_id or group_id
  string filename     = 4;
  bytes  data         = 5;
  string content_type = 6;
  string request_id   = 7;
}

message UploadFileResponse {
  bool         success = 1;
  FileMetadata file    = 2;
  string       message = 3;
}

message DownloadFileRequest {
  string token   = 1;
  string file_id = 2;
}

message DownloadFileResponse {
  bool         success = 1;
  bytes        data    = 2;
  FileMetadata file    = 3;
  string       message = 4;
}

// ─────────────────────────────────────────────────────────────
// LLM AI Assistance (Smart Replies & Summarization)
// ─────────────────────────────────────────────────────────────

message SmartReplyRequest {
  string          token           = 1;
  string          chat_type       = 2;
  string          target_id       = 3;
  repeated string chat_history    = 4; // entire conversation history
  string          current_message = 5;
  string          context_title   = 6;
  string          request_id      = 7;
}

message SmartReplyResponse {
  string          request_id  = 1;
  repeated string suggestions = 2;
  bool            success     = 3;
  string          error       = 4;
}

message SummarizeChatRequest {
  string          token        = 1;
  string          chat_type    = 2;
  string          target_id    = 3;
  repeated string chat_history = 4; // entire conversation history
  string          context_title= 5;
  string          request_id   = 6;
  string          current_user = 7;
}

message SummarizeChatResponse {
  string request_id = 1;
  string summary    = 2;
  bool   success    = 3;
  string error      = 4;
}

message ContextSuggestionRequest {
  string          token         = 1;
  string          chat_type     = 2;
  string          target_id     = 3;
  repeated string chat_history  = 4;
  string          context_title = 5;
  string          request_id    = 6;
}

message ContextSuggestionResponse {
  string request_id = 1;
  string suggestion = 2;
  bool   success    = 3;
  string error      = 4;
}

// ─────────────────────────────────────────────────────────────
// Assignment Explicit Required RPC Signatures
// ─────────────────────────────────────────────────────────────

message PostRequest {
  string token = 1;
  string type  = 2;
  string data  = 3;
}

message PostResponse {
  string status = 1;
  string data   = 2;
}

message GetRequest {
  string token  = 1;
  string type   = 2;
  string params = 3;
}

message KeyValue {
  string id   = 1;
  string data = 2;
}

message GetResponse {
  string            status = 1;
  repeated KeyValue items  = 2;
}

message BusinessRequest {
  string request_id = 1;
  string payload    = 2;
  string context    = 3;
}

message BusinessResponse {
  string request_id = 1;
  string status     = 2;
  string result     = 3;
}

// ─────────────────────────────────────────────────────────────
// System / Node Status
// ─────────────────────────────────────────────────────────────

message GetNodeStatusRequest {}

message GetNodeStatusResponse {
  string node_id      = 1;
  string state        = 2;
  int64  term         = 3;
  string leader_id    = 4;
  int64  commit_index = 5;
  int64  last_applied = 6;
}

message MarkReadRequest {
  string token     = 1;
  string chat_type = 2; // "DM" | "GROUP"
  string target_id = 3; // user_id or group_id
}

message MarkReadResponse {
  bool success = 1;
}

// ─────────────────────────────────────────────────────────────
// Service Definition
// ─────────────────────────────────────────────────────────────

service ChatService {
  // Auth
  rpc Signup(SignupRequest)                         returns (SignupResponse);
  rpc Login(LoginRequest)                           returns (LoginResponse);
  rpc Logout(LogoutRequest)                         returns (LogoutResponse);

  // Directory & Presence
  rpc ListUsers(ListUsersRequest)                   returns (ListUsersResponse);
  rpc GetUser(GetUserRequest)                       returns (GetUserResponse);
  rpc UpdatePresence(UpdatePresenceRequest)         returns (UpdatePresenceResponse);

  // Direct Messaging
  rpc SendDirectMessage(SendDirectMessageRequest)   returns (SendMessageResponse);
  rpc GetDirectMessages(GetDirectMessagesRequest)   returns (GetMessagesResponse);

  // Group Management & Messaging
  rpc CreateGroup(CreateGroupRequest)               returns (CreateGroupResponse);
  rpc UpdateGroup(UpdateGroupRequest)               returns (UpdateGroupResponse);
  rpc ListGroups(ListGroupsRequest)                 returns (ListGroupsResponse);
  rpc GetGroupMembers(GetGroupMembersRequest)       returns (GetGroupMembersResponse);
  rpc SendGroupMessage(SendGroupMessageRequest)     returns (SendMessageResponse);
  rpc GetGroupMessages(GetGroupMessagesRequest)     returns (GetMessagesResponse);
  rpc MarkRead(MarkReadRequest)                     returns (MarkReadResponse);

  // Streaming
  rpc StreamMessages(StreamMessagesRequest)         returns (stream MessageEvent);

  // Files
  rpc UploadFile(UploadFileRequest)                 returns (UploadFileResponse);
  rpc DownloadFile(DownloadFileRequest)             returns (DownloadFileResponse);

  // LLM Features
  rpc GetSmartReplies(SmartReplyRequest)           returns (SmartReplyResponse);
  rpc SummarizeChat(SummarizeChatRequest)           returns (SummarizeChatResponse);
  rpc GetContextSuggestion(ContextSuggestionRequest) returns (ContextSuggestionResponse);

  // Assignment Signatures
  rpc Post(PostRequest)                             returns (PostResponse);
  rpc Get(GetRequest)                               returns (GetResponse);
  rpc ProcessBusinessRequest(BusinessRequest)       returns (BusinessResponse);

  // Node Status
  rpc GetNodeStatus(GetNodeStatusRequest)           returns (GetNodeStatusResponse);
}
